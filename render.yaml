services:
  - type: web
    name: game-maps
    runtime: node
    repo: https://github.com/yourusername/game-maps
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: sqlite-data
      mountPath: /opt/render/project/src/src/db
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:/opt/render/project/src/src/db/sqlite.db
      - key: NEXTAUTH_URL
        sync: false # Set manually in dashboard
      - key: NEXTAUTH_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false